# =====================================================================
#  ALL INVITATION CONTENT LIVES HERE.
#  After editing, run:   python build.py
#  That regenerates index.html, engagement.ics and wedding.ics.
#  Plain "&" is fine everywhere — it is escaped automatically.
# =====================================================================

# ---------- live address (used for link-preview image URLs) ----------
site_url: "https://soorajabraham1.github.io/kiran-anju/"

# ---------- browser tab / search ----------
page:
  title: "Kiran & Anju — Wedding Invitation"
  description: "Kiran Jais and Anju Abraham invite you to their engagement and wedding."
  theme_color: "#24352B"

# ---------- link preview (WhatsApp, Facebook, X ...) ----------
share:
  site_name: "Kiran & Anju"
  title: "Kiran & Anju are getting married"
  description: "Engagement 02 January · Wedding 10 January 2027. Timings and directions inside."
  twitter_description: "Engagement 02 January · Wedding 10 January 2027."
  image: share-card.jpeg          # 1129 x 630
  image_width: 1129
  image_height: 630
  image_alt: "Kiran Jais and Anju Abraham — engagement 02 January, wedding 10 January 2027"

# ---------- images (all in img/) ----------
images:
  hero_wide: img/hero-wide.jpg          # desktop / landscape
  hero_portrait: img/hero-portrait.jpg  # phones
  hero_alt: "Kiran and Anju in a garden"
  leaf: img/leaf.png                    # watercolor ornament
  couple: img/couple.png                # illustration above the sign-off

# ---------- hero (first screen) ----------
hero:
  kicker: "Together with their families"
  first_names: ["Kiran", "Anju"]
  tagline: "are getting married"

# ---------- countdown (wedding ceremony start, India time) ----------
countdown:
  label: "Counting down to the wedding"
  to: "2027-01-10T17:30:00+05:30"

# ---------- section headings ----------
headings:
  invitation: "The Invitation"
  celebrations: "The Celebrations"

# ---------- verse & invitation ----------
verse:
  text: "“So they are no longer two, but one. Therefore, what God has joined together, let man not separate.”"
  cite: "Matthew 19:6"

lead_in: "Together with our families, we have the pleasure of requesting your esteemed presence at our betrothal and wedding of"

groom:
  name: "Kiran Jais Chemmanatte"
  parentage: "S/o Dr. Sindhumol Jacob & Dr. Jais P Chemmanattu"
  address: "Chemmanatte House, Uzhavoor, Kottayam"

bride:
  name: "Anju Abraham"
  parentage: "D/o Mrs. Shelcy Abraham & Mr. Abraham Thomas"
  address: "Kavanadiyil House, Chemperi, Kannur"

# ---------- events (event cards + calendar files) ----------
#  id          -> calendar file name (<id>.ics)
#  date        -> YYYY-MM-DD; weekday / day / month are derived from it
#  time        -> start time shown on the event card
#  place       -> main venue, one entry per line
#  start / end -> 24h times (IST) used only for the calendar file
#  stops       -> programme list on the event card
events:
  - id: engagement
    title: "Betrothal"
    date: 2027-01-02
    time: "5:30 PM"
    place:
      - "Our Lady of Lourdes Basilica"
      - "Chemperi"
    start: "17:30"
    end: "21:00"
    stops:
      - time: "5:30 PM"
        what: "Betrothal ceremony"
        where: "Our Lady of Lourdes Basilica, Chemperi"
        map: "https://maps.app.goo.gl/2BvKakWqRWWPQm9R8"
      - time: "6:00 PM"
        what: "Reception"
        where: "Same evening, following the ceremony at Chemperi Meadows"
        map: "https://maps.app.goo.gl/AWV4axcUvWkXK2Ru6"

  - id: wedding
    title: "Wedding"
    date: 2027-01-10
    time: "5:30 PM"
    place:
      - "St. Stephen's Knanaya Catholic Forane Church, Uzhavoor"
    start: "17:30"
    end: "22:00"
    stops:
      - time: "5:30 PM"
        what: "Wedding ceremony"
        where: "St. Stephen's Knanaya Catholic Forane Church, Uzhavoor"
        map: "https://maps.app.goo.gl/MrJUDg9LnRrHomyk7"
      - time: "7:00 PM"
        what: "Reception"
        where: "Same evening, following the ceremony at St. Stephen's Parish Hall"
        map: "https://maps.app.goo.gl/FLn7DrHpKMp3PKtcA"

# ---------- footer ----------
sign_off:
  lead: "With best compliments from"
  from: "Near & Dear Ones"

# ---------- calendar file text ----------
calendar:
  summary_prefix: "Kiran & Anju — "

# ---------- separate invite links ----------
#  Each entry builds <slug>/index.html showing ONLY the listed events.
#    https://soorajabraham1.github.io/kiran-anju/<slug>/
#  "events"    -> event ids (from the list above) shown on that page
#  "overrides" -> any setting above, replaced for that page only
#  The countdown on each page counts to its last event's start time.
#  The root link (index.html) stays the combined invitation.
invites:
  - slug: wdg
    events: [wedding]
    overrides:
      page:
        title: "Kiran & Anju — Wedding Invitation"
        description: "Kiran Jais and Anju Abraham invite you to their wedding."
        theme_color: "#24352B"
      share:
        site_name: "Kiran & Anju"
        title: "Kiran & Anju are getting married"
        description: "Wedding · Sunday, 10 January 2027 · Uzhavoor. Timings and directions inside."
        twitter_description: "Wedding · 10 January 2027."
        image: share-wedding.jpeg
        image_width: 1129
        image_height: 630
        image_alt: "Kiran Jais and Anju Abraham — wedding 10 January 2027"
      countdown:
        label: "Counting down to the wedding"
      lead_in: "Together with our families, we have the pleasure of requesting your esteemed presence at the wedding of"

  - slug: btl
    events: [engagement]
    overrides:
      page:
        title: "Kiran & Anju — Betrothal Invitation"
        description: "Kiran Jais and Anju Abraham invite you to their betrothal."
        theme_color: "#24352B"
      share:
        site_name: "Kiran & Anju"
        title: "Kiran & Anju are getting engaged"
        description: "Betrothal · Saturday, 02 January 2027 · Chemperi. Timings and directions inside."
        twitter_description: "Betrothal · 02 January 2027."
        image: share-betrothal.jpeg
        image_width: 1129
        image_height: 630
        image_alt: "Kiran Jais and Anju Abraham — betrothal 02 January 2027"
      hero:
        kicker: "Together with their families"
        first_names: ["Kiran", "Anju"]
        tagline: "are getting engaged"
      countdown:
        label: "Counting down to the betrothal"
      lead_in: "Together with our families, we have the pleasure of requesting your esteemed presence at the betrothal of"
